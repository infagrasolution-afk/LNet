<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01579b" />
      <stop offset="100%" stop-color="#0288d1" />
    </linearGradient>
    <linearGradient id="signalGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" />

  <!-- Stylized L & Network Fiber Node -->
  <!-- Vertical Bar of L -->
  <rect x="130" y="110" width="60" height="270" rx="30" fill="#ffffff" />

  <!-- Horizontal Base of L with Fiber Glow -->
  <rect x="130" y="320" width="220" height="60" rx="30" fill="#ffffff" />

  <!-- Fiber Pulse Node (Dot & Signal Rings) -->
  <circle cx="340" cy="210" r="32" fill="url(#signalGrad)" filter="url(#glow)" />
  <path d="M 290 210 A 50 50 0 0 1 340 160" fill="none" stroke="#00e5ff" stroke-width="18" stroke-linecap="round" />
  <path d="M 260 210 A 80 80 0 0 1 340 130" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="14" stroke-linecap="round" />
</svg>
